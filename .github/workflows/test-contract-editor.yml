# Lint and unit tests for contract-editor/ on pull requests.
name: Test contract editor

on:
  pull_request:
    paths:
      - "contract-editor/**"
      - ".github/workflows/test-contract-editor.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contract-editor
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: contract-editor/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
