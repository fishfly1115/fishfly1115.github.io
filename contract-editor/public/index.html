<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>合約共同編輯器</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@500;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px) }
body { margin: 0 }
img { max-width: 100% }
[hidden] { display: none !important }

/* Layout: one sheet of contract paper under a sticky "whose turn" bar; clauses read like a printed 契約書, changes marked like a lawyer's redline. */
:root {
  --paper: #eef1f5;
  --sheet: #ffffff;
  --ink: #1a2230;
  --muted: #5b6676;
  --line: #d9dee6;
  --accent: #1d4f8f;
  --accent-ink: #ffffff;
  --accent-soft: #e4ecf7;
  --ins-bg: #ddf2e3;
  --ins-fg: #11602c;
  --del-bg: #fae3e0;
  --del-fg: #9f2418;
  --turn-bg: #fff2d6;
  --turn-fg: #6d4a00;
  --seal: #b3261e;
  --shadow: 0 1px 2px rgba(20,30,50,.06), 0 8px 24px rgba(20,30,50,.06);
  --f-body: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;
  --f-clause: "Noto Serif TC", "Songti TC", "PMingLiU", serif;
  --f-data: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --paper: #0f131a; --sheet: #171c25; --ink: #e5e9ef; --muted: #9ba5b4; --line: #2a323e;
  --accent: #8db3ea; --accent-ink: #0f1a2b; --accent-soft: #1c2a3e;
  --ins-bg: #12341f; --ins-fg: #93dcaa; --del-bg: #3b1915; --del-fg: #f3a297;
  --turn-bg: #3a2b0b; --turn-fg: #f2cd7c; --seal: #ef7a70;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.25); color-scheme: dark } }
:root[data-theme="dark"] {
  --paper: #0f131a; --sheet: #171c25; --ink: #e5e9ef; --muted: #9ba5b4; --line: #2a323e;
  --accent: #8db3ea; --accent-ink: #0f1a2b; --accent-soft: #1c2a3e;
  --ins-bg: #12341f; --ins-fg: #93dcaa; --del-bg: #3b1915; --del-fg: #f3a297;
  --turn-bg: #3a2b0b; --turn-fg: #f2cd7c; --seal: #ef7a70;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.25); color-scheme: dark }

* { box-sizing: border-box }
body { background: var(--paper); color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.65 }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--sheet) }
button, input, textarea { font: inherit; color: inherit }
button { cursor: pointer }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px }
.wrap { max-width: 820px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)) }

/* Turn bar */
.turnbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--sheet); border-bottom: 1px solid var(--line) }
.turnbar .wrap { padding-block: 12px; display: flex; gap: 12px 16px; align-items: center; flex-wrap: wrap }
.stage { display: flex; gap: 10px; align-items: center; min-width: 0; flex: 1 1 320px }
.stage-dot { flex: none; width: 10px; height: 10px; border-radius: 50%; background: var(--muted) }
.stage[data-mine="1"] .stage-dot { background: var(--turn-fg); box-shadow: 0 0 0 4px var(--turn-bg) }
.stage-text { min-width: 0 }
.stage-title { font-weight: 700; font-size: 15px; text-wrap: balance }
.stage-sub { color: var(--muted); font-size: 13px }
.actions { display: flex; gap: 8px; flex-wrap: wrap; align-items: center }
.btn { border: 1px solid var(--line); background: var(--sheet); border-radius: 8px; padding: 7px 14px; font-size: 14px; font-weight: 500; white-space: nowrap }
.btn:hover { border-color: var(--muted) }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink) }
.btn.good { background: var(--ins-fg); border-color: var(--ins-fg); color: var(--sheet) }
.btn.bad { color: var(--del-fg); border-color: var(--del-fg); background: transparent }
.btn[disabled] { opacity: .45; cursor: not-allowed }
.btn.sm { padding: 4px 10px; font-size: 13px }
.btn.icon { padding: 4px 8px; font-size: 13px; min-width: 30px }
.linkbtn { border: 0; background: none; padding: 0; color: var(--accent); font-size: 13px; text-decoration: underline; text-underline-offset: 3px }

/* Header */
header.top { padding-block: 28px 8px; display: grid; gap: 6px }
.eyebrow { font-size: 12px; letter-spacing: .12em; color: var(--muted) }
h1 { margin: 0; font-family: var(--f-clause); font-size: 28px; font-weight: 700; letter-spacing: .04em; text-wrap: balance }
.lede { color: var(--muted); margin: 0; max-width: 62ch }
.exportbar { display: flex; gap: 10px 14px; align-items: center; flex-wrap: wrap; margin-top: 12px }
.exportbar .hint { color: var(--muted); font-size: 13px; flex: 1 1 240px }
.warnline { color: var(--turn-fg); background: var(--turn-bg); padding: 8px 12px; border-radius: 8px; font-size: 13px; flex: 1 1 100% }
.dangerline { color: var(--del-fg); background: var(--del-bg); padding: 10px 12px; border-radius: 8px; font-size: 13px }
.news { margin-top: 14px; background: var(--accent-soft); border-radius: 10px; padding: 12px 14px; display: grid; gap: 6px }
.news h2 { margin: 0; font-size: 14px }
.news ul { margin: 0; padding-left: 1.2em }
.news .row { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; align-items: center }

/* Tabs */
.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); margin-top: 20px; overflow-x: auto }
.tab { border: 0; background: none; padding: 10px 14px; font-weight: 500; color: var(--muted); border-bottom: 2px solid transparent; margin-bottom: -1px; white-space: nowrap }
.tab[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent) }
.count { display: inline-block; min-width: 20px; padding: 0 6px; margin-left: 6px; border-radius: 10px; background: var(--turn-bg); color: var(--turn-fg); font-size: 12px; font-family: var(--f-data); text-align: center; line-height: 20px }

/* Sheet & clauses */
.sheet { background: var(--sheet); border: 1px solid var(--line); border-radius: 4px; box-shadow: var(--shadow); margin-block: 18px 48px; padding: 8px clamp(16px, 5vw, 48px) 28px }
.clause { padding-block: 20px; border-bottom: 1px dashed var(--line); display: grid; gap: 8px; position: relative; min-width: 0 }
.clause[data-state="theirs"] { box-shadow: inset 3px 0 0 var(--turn-fg); padding-left: 14px; margin-left: -14px }
.clause[data-state="mine"] { box-shadow: inset 3px 0 0 var(--accent); padding-left: 14px; margin-left: -14px }
.clause.added .rich { background: var(--ins-bg); color: var(--ins-fg); border-radius: 4px; padding: 2px 8px }
.clause.added .editor .rich { background: var(--sheet); color: var(--ink) }
.clause.deleted .rich, .clause.deleted h3 { text-decoration: line-through; color: var(--del-fg) }
.clause.deleted .rich { background: var(--del-bg); border-radius: 4px; padding: 2px 8px }
.clause-head { display: flex; justify-content: space-between; gap: 10px; align-items: baseline; flex-wrap: wrap }
.clause h3 { margin: 0; font-family: var(--f-clause); font-size: 18px; font-weight: 700; letter-spacing: .03em; min-width: 0 }
.tools { display: flex; gap: 4px; flex-wrap: wrap }
.meta { color: var(--muted); font-size: 12px; font-family: var(--f-data) }
.pill { display: inline-flex; align-items: center; gap: 4px; padding: 1px 9px; border-radius: 999px; font-size: 12px; font-weight: 500; white-space: nowrap }
.pill.theirs { background: var(--turn-bg); color: var(--turn-fg) }
.pill.mine { background: var(--accent-soft); color: var(--accent) }
.pill.ok { background: var(--ins-bg); color: var(--ins-fg) }
.pill.no { background: var(--del-bg); color: var(--del-fg) }
.pill.plain { background: var(--paper); color: var(--muted) }
.newdot { width: 8px; height: 8px; border-radius: 50%; background: var(--seal); display: inline-block }
.review { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; padding: 10px 12px; background: var(--paper); border-radius: 8px }
.review .note { flex: 1 1 220px; color: var(--muted); font-size: 13px }
.confirm { display: grid; gap: 8px; padding: 10px 12px; border: 1px solid var(--del-fg); border-radius: 8px }
.confirm input { width: 100%; border: 1px solid var(--line); border-radius: 6px; padding: 6px 10px; background: var(--sheet) }
.addrow { display: flex; justify-content: center; padding-top: 16px }
ins.d { background: var(--ins-bg); color: var(--ins-fg); text-decoration: underline; text-decoration-thickness: 1px; text-underline-offset: 4px }
del.d { background: var(--del-bg); color: var(--del-fg); text-decoration: line-through }
del.d img { opacity: .5; outline: 2px solid var(--del-fg) }
ins.d img { outline: 2px solid var(--ins-fg) }
.legend { display: flex; gap: 12px; font-size: 12px; color: var(--muted); flex-wrap: wrap }

/* Rich clause content (from Word or the editor) */
.rich { font-family: var(--f-clause); font-size: 16px; line-height: 1.95; word-break: break-word; min-width: 0; overflow-x: auto }
.rich > :first-child { margin-top: 0 } .rich > :last-child { margin-bottom: 0 }
.rich p, .rich div { margin: 0 0 .5em }
.rich ol, .rich ul { margin: 0 0 .5em; padding-left: 2em }
.rich h1, .rich h2, .rich h3, .rich h4, .rich h5, .rich h6 { font-size: 1.05em; margin: .6em 0 .3em }
.rich table { border-collapse: collapse; margin: .4em 0 .8em; font-size: .95em }
.rich td, .rich th { border: 1px solid var(--line); padding: 4px 10px; vertical-align: top; min-width: 3em }
.rich img { max-width: 100%; height: auto }
.rich blockquote { margin: 0 0 .5em; padding-left: 1em; border-left: 3px solid var(--line) }

/* Editor */
.editor { display: grid; gap: 8px; min-width: 0 }
.editor input { width: 100%; border: 1px solid var(--line); border-radius: 6px; background: var(--paper); padding: 8px 10px; font-family: var(--f-clause); font-weight: 700; font-size: 17px }
.toolbar { display: flex; gap: 4px; flex-wrap: wrap; padding: 4px; border: 1px solid var(--line); border-bottom: 0; border-radius: 6px 6px 0 0; background: var(--paper) }
.toolbar button { border: 1px solid transparent; background: none; border-radius: 4px; padding: 2px 9px; font-size: 14px }
.toolbar button:hover { border-color: var(--line); background: var(--sheet) }
.editable { border: 1px solid var(--line); border-radius: 0 0 6px 6px; background: var(--sheet); padding: 10px 12px; min-height: 200px; outline: none }
.editable:focus { border-color: var(--accent) }
.editor .hint { font-size: 13px; color: var(--muted) }
.editor .warn { font-size: 13px; color: var(--del-fg); background: var(--del-bg); padding: 8px 10px; border-radius: 6px }

/* History */
.filters { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 16px }
.chip { border: 1px solid var(--line); background: var(--sheet); border-radius: 999px; padding: 3px 12px; font-size: 13px }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--sheet); border-color: var(--ink) }
.log { display: grid; gap: 12px; margin-block: 16px 48px }
.entry { background: var(--sheet); border: 1px solid var(--line); border-radius: 8px; padding: 14px 16px; display: grid; gap: 8px; min-width: 0 }
.entry-head { display: flex; gap: 8px 12px; align-items: center; flex-wrap: wrap }
.entry .rich { font-size: 15px; line-height: 1.85 }
.entry .rich.gone { text-decoration: line-through; color: var(--del-fg) }
.compare { display: grid; grid-template-columns: 1fr 1fr; gap: 12px }
.compare > div { min-width: 0; background: var(--paper); border-radius: 6px; padding: 10px 12px }
.compare h4 { margin: 0 0 4px; font-size: 12px; color: var(--muted); letter-spacing: .08em; font-weight: 500 }
@media (max-width: 640px) { .compare { grid-template-columns: 1fr } }
.empty { text-align: center; color: var(--muted); padding: 40px 16px }
.seal { display: inline-grid; place-items: center; width: 46px; height: 46px; border: 2px solid var(--seal); color: var(--seal); border-radius: 6px; font-family: var(--f-clause); font-weight: 700; font-size: 14px; line-height: 1.1; transform: rotate(-6deg); flex: none }

/* Import preview */
.import-panel { display: grid; gap: 14px; padding-top: 20px }
.import-panel .lead { margin: 0; color: var(--muted) }
.import-panel label { font-size: 13px; color: var(--muted) }
.import-panel input[type=text] { width: 100%; border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; background: var(--paper); font-family: var(--f-clause); font-weight: 700; font-size: 18px }
.plist { list-style: none; margin: 0; padding: 0; border: 1px solid var(--line); border-radius: 8px; max-height: 420px; overflow-y: auto }
.plist li { padding: 10px 14px; border-bottom: 1px solid var(--line); display: grid; gap: 2px; min-width: 0 }
.plist li:last-child { border-bottom: 0 }
.plist .pt { font-family: var(--f-clause); font-weight: 700 }
.plist .pp { color: var(--muted); font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap }

/* Off-screen print layout for PDF */
#pdf-stage { position: fixed; left: -12000px; top: 0; width: 794px; background: #fff; color: #111; font-family: var(--f-clause) }
#pdf-stage .pb { padding: 0 2px 22px; background: #fff }
#pdf-stage .ph { text-align: center; padding-bottom: 26px; position: relative }
#pdf-stage .ph h2 { margin: 0; font-size: 30px; letter-spacing: .3em; text-indent: .3em; font-weight: 700 }
#pdf-stage .ph p { margin: 8px 0 0; font-family: var(--f-body); font-size: 13px; color: #555 }
#pdf-stage .ph .seal { position: absolute; right: 8px; top: -4px; border-color: #b3261e; color: #b3261e }
#pdf-stage h3 { margin: 0 0 6px; font-size: 19px; font-weight: 700; letter-spacing: .03em }
#pdf-stage .rich { font-size: 16.5px; line-height: 2; overflow: visible }
#pdf-stage .rich td, #pdf-stage .rich th { border-color: #999 }

.toast { position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--sheet); padding: 10px 16px; border-radius: 8px; font-size: 14px; box-shadow: var(--shadow); max-width: calc(100vw - 32px); z-index: 20 }
@media (prefers-reduced-motion: no-preference) { .toast { animation: rise .25s ease-out } @keyframes rise { from { transform: translate(-50%, 8px); opacity: .4 } } }

/* Cloudflare edition: admin list, invite and name panels */
.panel { background: var(--sheet); border: 1px solid var(--line); border-radius: 10px; padding: 16px; display: grid; gap: 12px; margin-top: 14px }
.panel h2 { margin: 0; font-size: 16px }
.panel p { margin: 0; color: var(--muted); font-size: 14px }
.field { display: grid; gap: 4px }
.field label { font-size: 13px; color: var(--muted) }
.field input { width: 100%; border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; background: var(--paper) }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center }
.row .grow { flex: 1 1 220px; min-width: 0 }
.linkbox { font-family: var(--f-data); font-size: 12px; background: var(--paper); border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; word-break: break-all; user-select: all }
.plist2 { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px }
.plist2 li { display: flex; gap: 8px; align-items: center; justify-content: space-between; flex-wrap: wrap; padding: 8px 10px; background: var(--paper); border-radius: 6px }
.clist { list-style: none; margin: 16px 0 48px; padding: 0; display: grid; gap: 10px }
.clist li { background: var(--sheet); border: 1px solid var(--line); border-radius: 8px; padding: 14px 16px; display: flex; gap: 10px 16px; align-items: center; justify-content: space-between; flex-wrap: wrap }
.clist .t { font-family: var(--f-clause); font-weight: 700; font-size: 17px }
</style>
</head>
<body>
<div class="turnbar"><div class="wrap" id="turn"></div></div>
<div class="wrap">
  <header class="top">
    <div class="eyebrow" id="csource">雙方共同編輯</div>
    <h1 id="ctitle">合約共同編輯器</h1>
    <p class="lede" id="lede">匯入 Word 合約後，雙方直接點「修改」編輯，也能新增、刪除或移動條款。每次儲存都會自動記錄是誰、何時、改了什麼，原文以刪除線保留，由對方接受或退回。完成後匯出 PDF。</p>
    <div id="exportbar" class="exportbar"></div>
    <div id="people"></div>
    <div id="news"></div>
  </header>
  <nav class="tabs" role="tablist" id="tabs"></nav>
  <main id="main"></main>
</div>
<div id="toast" class="toast" role="status" hidden></div>
<div id="pdf-stage" aria-hidden="true"></div>
<input type="file" id="docx-input" accept=".docx,application/vnd.openxmlformats-officedocument.wordprocessingml.document" hidden>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3.0.6/dist/purify.min.js"></script>
<script src="/app.js"></script>
</body>
</html>
