<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>合約共同編輯器</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@500;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="/css/tokens.css">
<link rel="stylesheet" href="/css/base.css">
<link rel="stylesheet" href="/css/contract.css">
<link rel="stylesheet" href="/css/print.css">
</head>
<body>
<div class="turnbar"><div class="wrap" id="turn"></div></div>
<div class="wrap">
  <header class="top">
    <div class="eyebrow" id="csource">雙方共同編輯</div>
    <h1 id="ctitle">合約共同編輯器</h1>
    <p class="lede" id="lede">匯入契約草案（Word）後，雙方可直接修訂條文，並得新增、刪除或調整條文順序。每次儲存均自動記錄修訂人、時間與修訂前內容，原文以刪除線保留，由他方接受或退回；雙方確認定稿後，可匯出 PDF 定稿本。</p>
    <div id="exportbar" class="exportbar"></div>
    <div id="people"></div>
    <div id="news"></div>
  </header>
  <nav class="tabs" role="tablist" id="tabs"></nav>
  <main id="main"></main>
</div>
<div id="toast" class="toast" role="status" hidden></div>
<div id="pdf-stage" aria-hidden="true"></div>
<input type="file" id="rev-input" accept=".docx,application/vnd.openxmlformats-officedocument.wordprocessingml.document" hidden>
<input type="file" id="docx-input" accept=".docx,application/vnd.openxmlformats-officedocument.wordprocessingml.document" hidden>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3.0.6/dist/purify.min.js"></script>
<script type="module" src="/js/main.js"></script>
</body>
</html>
