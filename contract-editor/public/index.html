<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>合約共同編輯器</title>
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="light dark">
<script src="/js/theme-init.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@500;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="/css/tokens.css">
<link rel="stylesheet" href="/css/base.css">
<link rel="stylesheet" href="/css/contract.css">
<link rel="stylesheet" href="/css/print.css">
</head>
<body>
<div class="appbar">
  <div class="appbar-in">
    <a class="brand" id="brand" href="/"><span class="brand-mark" aria-hidden="true">約</span><span class="brand-name">合約共同編輯器</span></a>
    <nav class="crumb-bar" id="crumb" aria-label="目前位置"></nav>
    <div class="grow"></div>
    <div class="topact" id="turn"></div>
    <button class="btn icon ghost theme-btn" id="themebtn" type="button" aria-label="切換深色／淺色"></button>
  </div>
  <nav class="pagenav" id="tabs" aria-label="契約頁面" hidden></nav>
  <div class="flowbar" id="flowbar" hidden></div>
</div>
<div class="layout" id="layout">
  <aside class="outline" id="outline" aria-label="條文目錄" hidden></aside>
  <div class="content">
    <header class="top">
      <div class="eyebrow" id="csource"></div>
      <h1 id="ctitle">合約共同編輯器</h1>
      <p class="lede" id="lede" hidden></p>
      <div id="page-tasks"></div>
      <div id="toolbar" class="pagebar"></div>
      <div id="name-prompt"></div>
    </header>
    <main id="main"></main>
  </div>
</div>
<div id="dialog" hidden></div>
<div id="toast" class="toast" role="status" hidden></div>
<div id="pdf-stage" aria-hidden="true"></div>
<input type="file" id="rev-input" accept=".docx,application/vnd.openxmlformats-officedocument.wordprocessingml.document" hidden>
<input type="file" id="docx-input" accept=".docx,application/vnd.openxmlformats-officedocument.wordprocessingml.document" hidden>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3.0.6/dist/purify.min.js"></script>
<script type="module" src="/js/main.js"></script>
</body>
</html>
